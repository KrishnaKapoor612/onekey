<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Wispr Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Confirmation chip (appears above the pill when needed) -->
  <div id="confirmChip" class="confirm-chip hidden">
    <span id="confirmMsg">Confirm this action?</span>
    <button id="confirmBtn" class="chip-btn confirm">Confirm</button>
    <button id="cancelBtn" class="chip-btn cancel">Cancel</button>
  </div>

  <!-- History flyout (upward popover above the pill) -->
  <div id="historyFlyout" class="history-flyout hidden">
    <div class="flyout-header">
      <span class="flyout-title">Recent Commands</span>
      <button id="undoBtn" class="flyout-action">Undo Last</button>
    </div>
    <ul id="historyList" class="history-list"></ul>
  </div>

  <!-- Main HUD pill -->
  <div class="hud-pill">
    <button id="micBtn" class="mic-btn" title="Focus input">
      <svg class="mic-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3zm-1-9a1 1 0 112 0v6a1 1 0 01-2 0V5z"/>
        <path d="M19 11a1 1 0 10-2 0 5 5 0 01-10 0 1 1 0 10-2 0 7 7 0 006 6.93V20H8a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07A7 7 0 0019 11z"/>
      </svg>
    </button>

    <input id="cmdInput" type="text" maxlength="1000"
           placeholder="Type or dictate with Wispr Flow..."
           autocomplete="off" spellcheck="false">

    <div id="statusBadge" class="status-badge idle">
      <span id="statusText">Ready</span>
    </div>

    <button id="historyBtn" class="history-btn" title="Command history">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 117 7 6.97 6.97 0 01-4.95-2.05l-1.41 1.41A8.96 8.96 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
      </svg>
    </button>

    <button id="settingsBtn" class="history-btn" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </div>

  <!-- Settings dialog (modal) -->
  <dialog id="dlg">
    <h3>Settings</h3>
    <form id="form" method="dialog"></form>
    <div id="settingsErr" class="err"></div>
    <div class="dlg-row">
      <button id="saveSettings" class="chip-btn confirm">Save</button>
      <button id="closeDlg" class="chip-btn cancel">Close</button>
    </div>
    <hr>
    <h3>Command Aliases</h3>
    <div class="muted small">An alias is a list of supported action objects (JSON). Example: <code>[{"type":"OPEN_APP","appId":"vscode"}]</code></div>
    <input id="aliasPhrase" type="text" placeholder="phrase, e.g. start my day">
    <textarea id="aliasActions" rows="4" spellcheck="false" placeholder='[{"type":"OPEN_APP","appId":"vscode"}]'></textarea>
    <div class="dlg-row">
      <button id="aliasPreview" class="chip-btn">Preview</button>
      <button id="aliasSave" class="chip-btn confirm">Save alias</button>
    </div>
    <ul id="aliasPrev" class="muted"></ul>
    <div id="aliasErr" class="err"></div>
    <ul id="aliasList" class="alias-list"></ul>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
